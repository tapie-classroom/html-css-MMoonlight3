<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>나의 MBTI는?</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>나의 MBTI는?</h1>

  <div class="question">
    <p>Q1. 나는 에너지를 얻는 방식은?</p>
    <input type="radio" name="Q1" id="Q1-I">
    <label for="Q1-I">혼자 있을 때 충전됨 (I)</label>

    <input type="radio" name="Q1" id="Q1-E">
    <label for="Q1-E">사람들과 함께일 때 에너지 UP (E)</label>
  </div>

  <div class="question">
    <p>Q2. 정보를 인식하는 방식은?</p>
    <input type="radio" name="Q2" id="Q2-N">
    <label for="Q2-N">직관적으로 전체를 파악 (N)</label>

    <input type="radio" name="Q2" id="Q2-S">
    <label for="Q2-S">사실 위주로 받아들임 (S)</label>
  </div>

  <div class="question">
    <p>Q3. 나는 판단할 때...</p>
    <input type="radio" name="Q3" id="Q3-F">
    <label for="Q3-F">감정이 중요하다 (F)</label>

    <input type="radio" name="Q3" id="Q3-T">
    <label for="Q3-T">논리와 사실이 중요하다 (T)</label>
  </div>

  <div class="question">
    <p>Q4. 나는 계획을 세우는 방식은?</p>
    <input type="radio" name="Q4" id="Q4-J">
    <label for="Q4-J">계획적이고 구조적인 편 (J)</label>

    <input type="radio" name="Q4" id="Q4-P">
    <label for="Q4-P">즉흥적이고 융통성 있는 편 (P)</label>
  </div>

  <div class="result result-f">
    <h2>당신은 감성적인 유형입니다 💖</h2>
    <p>F 유형은 따뜻한 공감력과 관계 중심의 사고를 가진 성격입니다.</p>
  </div>

  <div class="result result-t">
    <h2>당신은 논리적인 유형입니다 🧠</h2>
    <p>T 유형은 객관적이고 분석적인 사고로 문제를 해결합니다.</p>
  </div>
</body>

</html>
